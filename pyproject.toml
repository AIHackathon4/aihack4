[project]
name = "aihack4"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=3.42.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
